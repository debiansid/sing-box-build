name: Build Android testing eBPF

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repository (owner/repo)"
        required: false
        type: string
        default: "debiansid/sing-box"
      source_ref:
        description: "Source branch/tag/commit"
        required: false
        type: string
        default: "testing-ebpf"

jobs:
  calculate_version:
    name: Calculate stable version
    runs-on: ubuntu-latest

    outputs:
      full_version: ${{ steps.outputs.outputs.full_version }}
      short_commit: ${{ steps.outputs.outputs.short_commit }}
      stable_tag: ${{ steps.outputs.outputs.stable_tag }}

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0

      - name: Get official stable version
        id: outputs
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Latest official stable release.
          # GitHub releases/latest excludes prereleases and drafts.
          LATEST_TAG=$(gh api \
            repos/SagerNet/sing-box/releases/latest \
            --jq '.tag_name')

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Failed to resolve latest stable SagerNet/sing-box release" >&2
            exit 1
          fi

          VERSION="${LATEST_TAG#v}"
          GIT_HASH=$(git rev-parse --short HEAD)
          FULL_VER="${VERSION}-${GIT_HASH}"

          echo "Official stable tag: ${LATEST_TAG}"
          echo "Source commit: ${GIT_HASH}"
          echo "Build version: ${FULL_VER}"

          echo "stable_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_version=${FULL_VER}" >> "$GITHUB_OUTPUT"
          echo "short_commit=${GIT_HASH}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Android arm64
    runs-on: ubuntu-24.04

    needs:
      - calculate_version

    env:
      TAGS: with_quic,with_utls,with_clash_api,with_provider,with_ebpf,badlinkname,tfogo_checklinkname0

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.8
          cache-dependency-path: source/go.mod

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Generate eBPF objects
        working-directory: source
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          BPF_CLANG: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang
        run: |
          set -euo pipefail

          make ebpf_generate
          make ebpf_check

      - name: Build
        working-directory: source
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: arm64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
          BPF_CLANG: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
          FULL_VER: ${{ needs.calculate_version.outputs.full_version }}
        run: |
          set -euo pipefail

          make build VERSION="${FULL_VER}"

      - name: Verify binary
        working-directory: source
        run: |
          set -euo pipefail

          test -f sing-box
          file sing-box

      - name: Archive
        working-directory: source
        env:
          FULL_VER: ${{ needs.calculate_version.outputs.full_version }}
        run: |
          set -euo pipefail

          mkdir -p dist

          tar -czf \
            "dist/sing-box-${FULL_VER}-android-arm64-ebpf-tc-bypass.tar.gz" \
            sing-box \
            LICENSE

          echo "Archive contents:"
          tar -tzf \
            "dist/sing-box-${FULL_VER}-android-arm64-ebpf-tc-bypass.tar.gz"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-android-arm64-ebpf-${{ needs.calculate_version.outputs.short_commit }}
          path: source/dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release
    runs-on: ubuntu-latest

    needs:
      - calculate_version
      - build

    permissions:
      contents: write

    concurrency:
      group: release-android-ebpf-tc-bypass-${{ needs.calculate_version.outputs.full_version }}
      cancel-in-progress: false

    steps:
      - name: Download archive
        uses: actions/download-artifact@v8.0.1
        with:
          name: sing-box-android-arm64-ebpf-${{ needs.calculate_version.outputs.short_commit }}
          path: artifact

      - name: Verify downloaded artifact
        run: |
          set -euo pipefail

          echo "Downloaded files:"
          find artifact -maxdepth 2 -type f -print

          ARCHIVE=$(find artifact -maxdepth 2 -type f -name '*.tar.gz' -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "Archive not found" >&2
            exit 1
          fi

          echo "Archive: ${ARCHIVE}"
          echo "Archive contents:"
          tar -tzf "$ARCHIVE"

      - name: Publish archive
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          FULL_VER: ${{ needs.calculate_version.outputs.full_version }}
          STABLE_TAG: ${{ needs.calculate_version.outputs.stable_tag }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_COMMIT: ${{ needs.calculate_version.outputs.short_commit }}
          BUILDER_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          TAG="android-ebpf-tc-bypass-${FULL_VER}"

          ARCHIVE=$(find artifact -maxdepth 2 -type f -name '*.tar.gz' -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "Archive not found" >&2
            exit 1
          fi

          echo "Official stable base: ${STABLE_TAG}"
          echo "Source: ${SOURCE_REPO}@${SOURCE_REF}"
          echo "Source commit: ${SOURCE_COMMIT}"
          echo "Release tag: ${TAG}"
          echo "Release asset: ${ARCHIVE}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$BUILDER_COMMIT" \
              --title "Android eBPF TC bypass ${FULL_VER}" \
              --notes "Built from ${SOURCE_REPO}@${SOURCE_REF} (${SOURCE_COMMIT}), based on official stable ${STABLE_TAG}." \
              --prerelease || {
                gh release view "$TAG" >/dev/null 2>&1 || exit 1
              }
          fi

          gh release upload \
            "$TAG" \
            "$ARCHIVE" \
            --clobber
