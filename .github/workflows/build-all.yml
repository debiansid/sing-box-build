name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        required: true
        type: string
      build:
        description: "Build type"
        required: true
        type: choice
        default: "All"
        options:
          - All
          - Binary
          - OpenWrt
          - Android
          - SFA
      forceBeta:
        description: "Force beta package name"
        required: false
        type: boolean
        default: false
      source_repo:
        description: "Source repository (owner/repo)"
        required: false
        type: string
        default: "debiansid/sing-box"
      source_ref:
        description: "Source branch/tag/commit"
        required: false
        type: string
        default: "testing-ebpf-tc"

concurrency:
  group: build-all-${{ github.ref }}-${{ inputs.version }}-${{ inputs.build }}
  cancel-in-progress: true

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.outputs.outputs.version }}
      git_hash: ${{ steps.outputs.outputs.git_hash }}
      full_version: ${{ steps.outputs.outputs.full_version }}
      source_git_hash: ${{ steps.source_info.outputs.git_hash }}

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Checkout source repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: 1.26.6
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('source/go.sum') }}
          restore-keys: go-mod-linux-

      - name: Cache Go build cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-tools-linux-${{ hashFiles('source/go.sum') }}
          restore-keys: go-build-tools-linux-

      - name: Get source git hash
        id: source_info
        working-directory: source
        run: |-
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "git_hash=${GIT_HASH}" >> "$GITHUB_OUTPUT"

      - name: Set outputs
        id: outputs
        run: |-
          RAW_VER="${{ inputs.version }}"

          if [[ -z "$RAW_VER" || "$RAW_VER" =~ [[:space:]] ]]; then
            echo "ERROR: version input cannot be empty or contain whitespace: '$RAW_VER'" >&2
            exit 1
          fi

          VERSION_PATTERN='^v?[0-9]+(\.[0-9]+)+([.-][0-9A-Za-z.-]+)*$'

          if [[ ! "$RAW_VER" =~ $VERSION_PATTERN ]]; then
            echo "ERROR: Illegal version format: '$RAW_VER'" >&2
            exit 1
          fi

          VER="${RAW_VER#v}"

          GIT_HASH="${{ steps.source_info.outputs.git_hash }}"
          FULL_VER="${VER}-${GIT_HASH}"

          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "git_hash=${GIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "full_version=${FULL_VER}" >> "$GITHUB_OUTPUT"

  # ========================================================
  # Unified build matrix
  # ========================================================
  build:
    name: ${{ matrix.name }}

    if: >
      inputs.build == 'All' ||
      inputs.build == 'Binary' ||
      inputs.build == 'OpenWrt' ||
      inputs.build == 'Android' ||
      inputs.build == 'SFA'

    runs-on: ${{ matrix.runner }}

    needs:
      - calculate_version

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: "Linux amd64 (musl)"
            os: linux
            arch: amd64
            variant: musl
            runner: ubuntu-latest
            type: binary

          - name: "OpenWrt arm64 (musl)"
            os: linux
            arch: arm64
            variant: musl
            runner: ubuntu-latest
            type: openwrt
            openwrt_arch: aarch64_cortex-a53

          - name: "Android arm64 core"
            os: android
            arch: arm64
            runner: ubuntu-latest
            type: android

          - name: "Windows amd64"
            os: windows
            arch: amd64
            runner: windows-latest
            type: binary

          - name: "SFA (sing-box for android)"
            os: android
            arch: arm64
            runner: ubuntu-latest
            type: sfa

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Checkout source repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0

      # ========================================================
      # SFA source
      # ========================================================
      - name: Checkout SFA Repository
        if: matrix.type == 'sfa' && (inputs.build == 'All' || inputs.build == 'SFA')
        uses: actions/checkout@v7
        with:
          repository: SagerNet/sing-box-for-android
          ref: dev
          path: SFA
          submodules: recursive

      # ========================================================
      # Go
      # ========================================================
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.6
          cache: false

      - name: Cache Go modules (Linux)
        if: runner.os != 'Windows'
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('source/go.sum') }}
          restore-keys: go-mod-linux-

      - name: Cache Go build cache (Linux)
        if: runner.os != 'Windows'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-tools-linux-${{ matrix.type }}-${{ matrix.arch }}-${{ hashFiles('source/go.sum') }}
          restore-keys: |
            go-build-tools-linux-${{ matrix.type }}-${{ matrix.arch }}-
            go-build-tools-linux-${{ matrix.type }}-

      - name: Cache Go modules (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-windows-${{ hashFiles('source/go.sum') }}
          restore-keys: go-mod-windows-

      - name: Cache Go build cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6.1.0
        with:
          path: ~/AppData/Local/go-build
          key: go-build-tools-windows-${{ matrix.type }}-${{ hashFiles('source/go.sum') }}
          restore-keys: go-build-tools-windows-${{ matrix.type }}-

      # ========================================================
      # OpenWrt ARM64 musl toolchain
      #
      # No Zig.
      # No cronet-go.
      #
      # musl.cc provides a real GCC cross toolchain:
      #   aarch64-linux-musl-gcc
      #   aarch64-linux-musl-g++
      # ========================================================
      - name: Install OpenWrt ARM64 musl toolchain
        if: matrix.type == 'openwrt' && (inputs.build == 'All' || inputs.build == 'OpenWrt')
        shell: bash
        run: |
          set -xeuo pipefail

          TOOLCHAIN_ROOT="${RUNNER_TEMP}/musl-cross"
          TOOLCHAIN_ARCHIVE="${RUNNER_TEMP}/aarch64-linux-musl-cross.tgz"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --output "${TOOLCHAIN_ARCHIVE}" \
            "https://musl.cc/aarch64-linux-musl-cross.tgz"

          mkdir -p "${TOOLCHAIN_ROOT}"

          tar \
            -xzf "${TOOLCHAIN_ARCHIVE}" \
            -C "${TOOLCHAIN_ROOT}" \
            --strip-components=1

          echo "${TOOLCHAIN_ROOT}/bin" >> "${GITHUB_PATH}"

          "${TOOLCHAIN_ROOT}/bin/aarch64-linux-musl-gcc" --version
          "${TOOLCHAIN_ROOT}/bin/aarch64-linux-musl-g++" --version

      # ========================================================
      # Android NDK
      # ========================================================
      - name: Setup Android NDK
        if: matrix.os == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true
          local-cache: false

      # ========================================================
      # Java / Gradle for SFA
      # ========================================================
      - name: Setup OpenJDK
        if: matrix.type == 'sfa' && (inputs.build == 'All' || inputs.build == 'SFA')
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        if: matrix.type == 'sfa' && (inputs.build == 'All' || inputs.build == 'SFA')
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('SFA/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ========================================================
      # Source version tag
      # ========================================================
      - name: Set tag (Linux/Android)
        if: runner.os != 'Windows'
        working-directory: source
        run: |-
          git ls-remote --exit-code --tags origin v${{ needs.calculate_version.outputs.version }} || echo "PUBLISHED=false" >> "$GITHUB_ENV"
          git tag v${{ needs.calculate_version.outputs.version }} -f

      - name: Set tag (Windows)
        if: runner.os == 'Windows'
        working-directory: source
        run: |-
          git ls-remote --exit-code --tags origin v${{ needs.calculate_version.outputs.version }} || echo "PUBLISHED=false" >> "$env:GITHUB_ENV"
          git tag v${{ needs.calculate_version.outputs.version }} -f

      # ========================================================
      # Build tags
      # ========================================================

      # Existing Linux target is intentionally unchanged.
      - name: Set build tags (Linux)
        if: runner.os != 'Windows' && matrix.type == 'binary'
        shell: bash
        run: |
          set -xeuo pipefail

          TAGS='with_gvisor,with_quic,with_utls,with_clash_api,with_provider,with_ebpf,badlinkname,tfogo_checklinkname0,with_musl'

          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"

      # Dedicated OpenWrt target.
      #
      # Included:
      #   with_quic
      #   with_wireguard
      #   with_utls
      #   with_clash_api
      #   with_provider
      #   with_tailscale
      #   with_ebpf
      #   with_musl
      #
      # Deliberately NOT included:
      #   with_gvisor
      #   cronet / naive
      #   ts_omit_*
      - name: Set build tags (OpenWrt)
        if: matrix.type == 'openwrt'
        shell: bash
        run: |
          set -xeuo pipefail

          TAGS='with_quic,with_wireguard,with_utls,with_clash_api,with_provider,with_tailscale,with_ebpf,with_musl,badlinkname,tfogo_checklinkname0'

          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"

      - name: Set build tags (Android Core)
        if: matrix.type == 'android'
        shell: bash
        run: |
          set -xeuo pipefail

          TAGS='with_quic,with_utls,with_clash_api,with_provider,with_ebpf,badlinkname,tfogo_checklinkname0'

          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"

      - name: Set build tags (SFA)
        if: matrix.type == 'sfa'
        shell: bash
        run: |-
          echo "BUILD_TAGS=with_gvisor,with_quic,with_utls,with_clash_api,with_provider,with_conntrack,without_badtls,badlinkname,tfogo_checklinkname0" >> "${GITHUB_ENV}"

      - name: Set build tags (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TAGS = "with_gvisor,with_quic,with_utls,with_clash_api,with_provider,with_tailscale,badlinkname,tfogo_checklinkname0"
          echo "BUILD_TAGS=$TAGS" >> $env:GITHUB_ENV

      # ========================================================
      # Existing Linux amd64 musl
      # ========================================================
      - name: Build Linux binary (musl)
        if: >
          matrix.type == 'binary' &&
          matrix.variant == 'musl' &&
          (inputs.build == 'All' || inputs.build == 'Binary')
        working-directory: source
        shell: bash
        run: |
          set -xeuo pipefail

          mkdir -p dist

          make build VERSION="${FULL_VER}"

          mv sing-box dist/
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          TAGS: ${{ env.BUILD_TAGS }}
          FULL_VER: ${{ needs.calculate_version.outputs.full_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================
      # OpenWrt ARM64 musl
      # ========================================================
      - name: Build OpenWrt ARM64 musl
        if: matrix.type == 'openwrt' && (inputs.build == 'All' || inputs.build == 'OpenWrt')
        working-directory: source
        shell: bash
        run: |
          set -xeuo pipefail

          mkdir -p dist

          export CC="aarch64-linux-musl-gcc"
          export CXX="aarch64-linux-musl-g++"

          # Userspace:
          #   aarch64-linux-musl-gcc
          #
          # eBPF:
          #   clang
          #
          # Do not use the ARM64 userspace compiler as BPF_CLANG.
          export BPF_CLANG="clang"

          echo "=== Toolchain ==="
          "${CC}" --version
          "${CXX}" --version
          clang --version

          echo
          echo "=== Target ==="
          echo "GOOS=${GOOS}"
          echo "GOARCH=${GOARCH}"
          echo "CGO_ENABLED=${CGO_ENABLED}"
          echo "CC=${CC}"
          echo "CXX=${CXX}"
          echo "BPF_CLANG=${BPF_CLANG}"
          echo "TAGS=${TAGS}"

          make build VERSION="${FULL_VER}"

          mv sing-box dist/

          echo
          echo "=== Built binary ==="
          file dist/sing-box
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: arm64
          TAGS: ${{ env.BUILD_TAGS }}
          FULL_VER: ${{ needs.calculate_version.outputs.full_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================
      # OpenWrt ELF validation
      # ========================================================
      - name: Verify OpenWrt ARM64 binary
        if: matrix.type == 'openwrt' && (inputs.build == 'All' || inputs.build == 'OpenWrt')
        working-directory: source
        shell: bash
        run: |
          set -xeuo pipefail

          echo "=== file ==="
          file dist/sing-box

          echo
          echo "=== ELF header ==="
          readelf -h dist/sing-box | grep -E 'Class:|Data:|Machine:'

          echo
          echo "=== ELF interpreter ==="
          INTERPRETER="$(readelf -l dist/sing-box | grep -i interpreter || true)"
          echo "${INTERPRETER}"

          echo
          echo "=== Dynamic dependencies ==="
          readelf -d dist/sing-box | grep NEEDED || true

          echo
          echo "=== Validate architecture ==="

          if ! readelf -h dist/sing