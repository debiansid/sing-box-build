name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        required: true
        type: string
      build:
        description: "Build type"
        required: true
        type: choice
        default: "All"
        options:
          - All
          - Binary
          - OpenWrt
          - Android
          - SFA
      forceBeta:
        description: "Force beta package name"
        required: false
        type: boolean
        default: false
      source_repo:
        description: "Source repository (owner/repo)"
        required: false
        type: string
        default: "debiansid/sing-box"
      source_ref:
        description: "Source branch/tag/commit"
        required: false
        type: string
        default: "testing-ebpf-tc"

concurrency:
  group: build-all-${{ github.ref }}-${{ inputs.version }}-${{ inputs.build }}
  cancel-in-progress: true

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.outputs.outputs.version }}
      git_hash: ${{ steps.outputs.outputs.git_hash }}
      full_version: ${{ steps.outputs.outputs.full_version }}
      source_git_hash: ${{ steps.source_info.outputs.git_hash }}

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Checkout source repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: 1.26.6
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('source/go.sum') }}
          restore-keys: go-mod-linux-

      - name: Cache Go build cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-tools-linux-${{ hashFiles('source/go.sum') }}
          restore-keys: go-build-tools-linux-

      - name: Get source git hash
        id: source_info
        working-directory: source
        run: |-
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "git_hash=${GIT_HASH}" >> "$GITHUB_OUTPUT"

      - name: Set outputs
        id: outputs
        run: |-
          RAW_VER="${{ inputs.version }}"

          if [[ -z "$RAW_VER" || "$RAW_VER" =~ [[:space:]] ]]; then
            echo "ERROR: version input cannot be empty or contain whitespace: '$RAW_VER'" >&2
            exit 1
          fi

          VERSION_PATTERN='^v?[0-9]+(\.[0-9]+)+([.-][0-9A-Za-z.-]+)*$'

          if [[ ! "$RAW_VER" =~ $VERSION_PATTERN ]]; then
            echo "ERROR: Illegal version format: '$RAW_VER'" >&2
            exit 1
          fi

          VER="${RAW_VER#v}"

          GIT_HASH="${{ steps.source_info.outputs.git_hash }}"
          FULL_VER="${VER}-${GIT_HASH}"

          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "git_hash=${GIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "full_version=${FULL_VER}" >> "$GITHUB_OUTPUT"

  # ========================================================
  # Job 1: Unified target matrix
  # ========================================================
  build:
    name: ${{ matrix.name }}

    if: >
      inputs.build == 'All' ||
      inputs.build == 'Binary' ||
      inputs.build == 'OpenWrt' ||
      inputs.build == 'Android' ||
      inputs.build == 'SFA'

    runs-on: ${{ matrix.runner }}

    needs:
      - calculate_version

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: "Linux amd64 (musl)"
            os: linux
            arch: amd64
            variant: musl
            runner: ubuntu-latest
            type: binary

          - name: "OpenWrt arm64 (musl)"
            os: linux
            arch: arm64
            variant: musl
            runner: ubuntu-latest
            type: openwrt
            openwrt_arch: aarch64_cortex-a53

          - name: "Android arm64 core"
            os: android
            arch: arm64
            runner: ubuntu-latest
            type: android

          - name: "Windows amd64"
            os: windows
            arch: amd64
            runner: windows-latest
            type: binary

          - name: "SFA (sing-box for android)"
            os: android
            arch: arm64
            runner: ubuntu-latest
            type: sfa

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Checkout source repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0

      # --------------------------------------------------------
      # SFA source
      # --------------------------------------------------------
      - name: Checkout SFA Repository
        if: matrix.type == 'sfa' && (inputs.build == 'All' || inputs.build == 'SFA')
        uses: actions/checkout@v7
        with:
          repository: SagerNet/sing-box-for-android
          ref: dev
          path: SFA
          submodules: recursive

      # --------------------------------------------------------
      # Go
      # --------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.6
          cache: false

      - name: Cache Go modules (Linux)
        if: runner.os != 'Windows'
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('source/go.sum') }}
          restore-keys: go-mod-linux-

      - name: Cache Go build cache (Linux)
        if: runner.os != 'Windows'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-tools-linux-${{ matrix.type }}-${{ matrix.arch }}-${{ hashFiles('source/go.sum') }}
          restore-keys: |
            go-build-tools-linux-${{ matrix.type }}-${{ matrix.arch }}-
            go-build-tools-linux-${{ matrix.type }}-

      - name: Cache Go modules (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-windows-${{ hashFiles('source/go.sum') }}
          restore-keys: go-mod-windows-

      - name: Cache Go build cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6.1.0
        with:
          path: ~/AppData/Local/go-build
          key: go-build-tools-windows-${{ matrix.type }}-${{ hashFiles('source/go.sum') }}
          restore-keys: go-build-tools-windows-${{ matrix.type }}-

      # --------------------------------------------------------
      # OpenWrt ARM64 musl cross toolchain
      #
      # Zig is used only as the Linux ARM64 musl CGO linker.
      # eBPF bytecode remains compiled by clang via BPF_CLANG.
      # --------------------------------------------------------
      - name: Setup Zig
        if: matrix.type == 'openwrt' && (inputs.build == 'All' || inputs.build == 'OpenWrt')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Setup OpenWrt ARM64 musl compiler wrappers
        if: matrix.type == 'openwrt' && (inputs.build == 'All' || inputs.build == 'OpenWrt')
        shell: bash
        run: |
          set -xeuo pipefail

          CROSS_DIR="${RUNNER_TEMP}/openwrt-cross"
          mkdir -p "${CROSS_DIR}"

          cat > "${CROSS_DIR}/aarch64-linux-musl-cc" <<'EOF'
          #!/bin/sh
          exec zig cc -target aarch64-linux-musl "$@"
          EOF

          cat > "${CROSS_DIR}/aarch64-linux-musl-cxx" <<'EOF'
          #!/bin/sh
          exec zig c++ -target aarch64-linux-musl "$@"
          EOF

          chmod 0755 \
            "${CROSS_DIR}/aarch64-linux-musl-cc" \
            "${CROSS_DIR}/aarch64-linux-musl-cxx"

          echo "${CROSS_DIR}" >> "${GITHUB_PATH}"

      # --------------------------------------------------------
      # Android NDK
      # --------------------------------------------------------
      - name: Setup Android NDK
        if: matrix.os == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true
          local-cache: false

      # --------------------------------------------------------
      # Java / Gradle for SFA
      # --------------------------------------------------------
      - name: Setup OpenJDK
        if: matrix.type == 'sfa' && (inputs.build == 'All' || inputs.build == 'SFA')
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        if: matrix.type == 'sfa' && (inputs.build == 'All' || inputs.build == 'SFA')
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('SFA/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # --------------------------------------------------------
      # Version tag
      # --------------------------------------------------------
      - name: Set tag (Linux/Android)
        if: runner.os != 'Windows'
        working-directory: source
        run: |-
          git ls-remote --exit-code --tags origin v${{ needs.calculate_version.outputs.version }} || echo "PUBLISHED=false" >> "$GITHUB_ENV"
          git tag v${{ needs.calculate_version.outputs.version }} -f

      - name: Set tag (Windows)
        if: runner.os == 'Windows'
        working-directory: source
        run: |-
          git ls-remote --exit-code --tags origin v${{ needs.calculate_version.outputs.version }} || echo "PUBLISHED=false" >> "$env:GITHUB_ENV"
          git tag v${{ needs.calculate_version.outputs.version }} -f

      # ========================================================
      # Build tags
      # ========================================================

      # Existing generic Linux build stays unchanged.
      - name: Set build tags (Linux)
        if: >
          runner.os != 'Windows' &&
          matrix.type == 'binary'
        shell: bash
        run: |
          set -xeuo pipefail

          TAGS='with_gvisor,with_quic,with_utls,with_clash_api,with_provider,with_ebpf,badlinkname,tfogo_checklinkname0,with_musl'

          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"

      # Dedicated OpenWrt build.
      #
      # Intentionally:
      #   + with_ebpf
      #   + with_tailscale
      #   + with_wireguard
      #   + with_musl
      #
      # Intentionally absent:
      #   - with_gvisor
      #   - naive / cronet
      #   - ts_omit_*
      - name: Set build tags (OpenWrt)
        if: matrix.type == 'openwrt'
        shell: bash
        run: |
          set -xeuo pipefail

          TAGS='with_quic,with_wireguard,with_utls,with_clash_api,with_provider,with_tailscale,with_ebpf,with_musl,badlinkname,tfogo_checklinkname0'

          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"

      - name: Set build tags (Android Core)
        if: matrix.type == 'android'
        shell: bash
        run: |
          set -xeuo pipefail

          TAGS='with_quic,with_utls,with_clash_api,with_provider,with_ebpf,badlinkname,tfogo_checklinkname0'

          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"

      - name: Set build tags (SFA)
        if: matrix.type == 'sfa'
        shell: bash
        run: |-
          echo "BUILD_TAGS=with_gvisor,with_quic,with_utls,with_clash_api,with_provider,with_conntrack,without_badtls,badlinkname,tfogo_checklinkname0" >> "${GITHUB_ENV}"

      - name: Set build tags (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TAGS = "with_gvisor,with_quic,with_utls,with_clash_api,with_provider,with_tailscale,badlinkname,tfogo_checklinkname0"
          echo "BUILD_TAGS=$TAGS" >> $env:GITHUB_ENV

      # ========================================================
      # 1. Existing Linux amd64 musl build
      # ========================================================
      - name: Build Linux binary (musl)
        if: >
          matrix.type == 'binary' &&
          matrix.variant == 'musl' &&
          (inputs.build == 'All' || inputs.build == 'Binary')
        working-directory: source
        shell: bash
        run: |
          set -xeuo pipefail

          mkdir -p dist

          make build VERSION="${FULL_VER}"

          mv sing-box dist/
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          TAGS: ${{ env.BUILD_TAGS }}
          FULL_VER: ${{ needs.calculate_version.outputs.full_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================
      # 2. OpenWrt ARM64 musl build
      # ========================================================
      - name: Build OpenWrt ARM64 musl
        if: >
          matrix.type == 'openwrt' &&
          (inputs.build == 'All' || inputs.build == 'OpenWrt')
        working-directory: source
        shell: bash
        run: |
          set -xeuo pipefail

          mkdir -p dist

          export CC="aarch64-linux-musl-cc"
          export CXX="aarch64-linux-musl-cxx"

          # BPF compiler is deliberately independent from the userspace
          # ARM64/musl CGO compiler.
          export BPF_CLANG="clang"

          make build VERSION="${FULL_VER}"

          mv sing-box dist/

          echo
          echo "=== built binary ==="
          file dist/sing-box
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: arm64
          TAGS: ${{ env.BUILD_TAGS }}
          FULL_VER: ${{ needs.calculate_version.outputs.full_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # OpenWrt ELF verification
      # --------------------------------------------------------
      - name: Verify OpenWrt ARM64 binary
        if: >
          matrix.type == 'openwrt' &&
          (inputs.build == 'All' || inputs.build == 'OpenWrt')
        working-directory: source
        shell: bash
        run: |
          set -xeuo pipefail

          echo "=== file ==="
          file dist/sing-box

          echo
          echo "=== ELF header ==="
          readelf -h dist/sing-box | grep -E 'Class:|Data:|Machine:'

          echo
          echo "=== ELF interpreter ==="
          readelf -l dist/sing-box | grep -i interpreter || true

          echo
          echo "=== Dynamic dependencies ==="
          readelf -d dist/sing-box | grep NEEDED || true

          echo
          echo "=== Reject Android loader ==="

          if readelf -l dist/sing-box | grep -q '/system/bin/linker'; then
            echo "ERROR: Android ELF interpreter detected." >&2
            exit 1
          fi

          echo
          echo "=== Reject glibc loader ==="

          if readelf -l dist/sing-box | grep -Eq 'ld-linux-aarch64|glibc'; then
            echo "ERROR: glibc ELF interpreter detected." >&2
            exit 1
          fi

          echo
          echo "OpenWrt ARM64 ELF verification passed."

      # ========================================================
      # 3. Android Core
      # ========================================================
      - name: Build Android core
        if: matrix.type == 'android' && (inputs.build == 'All' || inputs.build == 'Android')
        working-directory: source
        shell: bash
        run: |
          set -xeuo pipefail

          mkdir -p dist

          TARGET_CLANG="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

          CC=${TARGET_CLANG} BPF_CLANG=${TARGET_CLANG} \
          make build VERSION="${FULL_VER}"

          mv sing-box dist/
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: arm64
          TAGS: ${{ env.BUILD_TAGS }}
          FULL_VER: ${{ needs.calculate_version.outputs.full_version }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # ========================================================
      # 4. Windows
      # ========================================================
      - name: Build Windows
        if: matrix.os == 'windows' && (inputs.build == 'All' || inputs.build == 'Binary')
        working-directory: source
        shell: pwsh
        run: |
          mkdir -p dist

          $FULL_VER = "${{ needs.calculate_version.outputs.full_version }}"

          go build `
            -v `
            -trimpath `
            -o dist/sing-box.exe `
            -tags "$env:BUILD_TAGS" `
            -ldflags "-X=runtime.godebugDefault=asynctimerchan=1 -X 'github.com/sagernet/sing-box/constant.Version=$FULL_VER' -checklinkname=0 -H windowsgui -s -w -buildid=" `
            ./cmd/sing-box

          go build `
            -v `
            -trimpath `
            -o dist/sing-box-cli.exe `
            -tags "$env:BUILD_TAGS" `
            -ldflags "-X=runtime.godebugDefault=asynctimerchan=1 -X 'github.com/sagernet/sing-box/constant.Version=$FULL_VER' -checklinkname=0 -s -w -buildid=" `
            ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================
      # 5. SFA
      # ========================================================
      - name: Build libbox.aar (SFA)
        if: matrix.type == 'sfa' && (inputs.build == 'All' || inputs.build == 'SFA')
        working-directory: source
        shell: bash
        run: |
          set -xeuo pipefail

          mkdir -p ../SFA/app/libs/

          make lib_install

          FULL_VER="${{ needs.calculate_version.outputs.full_version }}"

          CC="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

          CGO_ENABLED=1 CC=${CC} gomobile bind -v \
            -target android \
            -androidapi 23 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath \
            -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${FULL_VER} -s -w -buildid= -checklinkname=0" \
            -tags "${BUILD_TAGS}" \
            ./experimental/libbox

          cp libbox.aar ../SFA/app/libs/
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build SFA APK
        if: matrix.type == 'sfa' && (inputs.build == 'All' || inputs.build == 'SFA')
        working-directory: SFA
        shell: bash
        run: |
          set -xeuo pipefail

          sed -i '/signingConfigs {/,/^    }/d' app/build.gradle.kts
          sed -i '/signingConfig = signingConfigs/d' app/build.gradle.kts

          chmod +x ./gradlew

          ./gradlew \
            --build-cache \
            --parallel \
            :app:assembleOtherRelease

          ./gradlew --stop

      - name: Sign SFA
        if: matrix.type == 'sfa' && (inputs.build == 'All' || inputs.build == 'SFA')
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: SFA/app/build/outputs/apk/other/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      # ========================================================
      # Reproducible timestamp
      # ========================================================
      - name: Set mtime (Linux)
        if: >
          matrix.os == 'linux' &&
          matrix.variant == 'musl' &&
          (inputs.build == 'All' || inputs.build == 'Binary' || inputs.build == 'OpenWrt')
        working-directory: source
        shell: bash
        run: |-
          TZ=UTC touch -t '197001010000' dist/sing-box

      # ========================================================
      # Archive names
      # ========================================================
      - name: Set name (Linux/Android)
        if: runner.os != 'Windows' && matrix.type != 'sfa'
        shell: bash
        run: |-
          if [[ "${{ matrix.type }}" == "openwrt" ]]; then
            DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-openwrt-${{ matrix.arch }}-musl"
          else
            DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"

            if [[ "${{ matrix.variant }}" == "musl" ]]; then
              DIR_NAME="${DIR_NAME}-musl"
            fi
          fi

          echo "DIR_NAME=${DIR_NAME}" >> "${GITHUB_ENV}"

      - name: Set name (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |-
          $DIR_NAME = "sing-box-${{ needs.calculate_version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
          echo "DIR_NAME=$DIR_NAME" >> $env:GITHUB_ENV

      # ========================================================
      # Archive
      # ========================================================
      - name: Archive (Linux/Android)
        if: runner.os != 'Windows' && matrix.type != 'sfa'
        working-directory: source/dist
        shell: bash
        run: |
          set -xeuo pipefail

          mkdir -p "${DIR_NAME}"

          cp ../LICENSE "${DIR_NAME}/"
          cp sing-box "${DIR_NAME}/"

          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"

          rm -rf "${DIR_NAME}"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        run: |
          $distDir = "dist"

          # GUI version
          $guiDir = "${env:DIR_NAME}"
          $guiPath = Join-Path $distDir $guiDir

          New-Item -ItemType Directory -Force -Path $guiPath | Out-Null

          Copy-Item LICENSE $guiPath
          Copy-Item "dist/sing-box.exe" $guiPath

          Push-Location $distDir

          Compress-Archive `
            -Path $guiDir `
            -DestinationPath "${guiDir}.zip" `
            -Force

          Remove-Item -Recurse -Force $guiDir

          Pop-Location

          # CLI version
          $cliDir = "${env:DIR_NAME}-cli"
          $cliPath = Join-Path $distDir $cliDir

          New-Item -ItemType Directory -Force -Path $cliPath | Out-Null

          Copy-Item LICENSE $cliPath
          Copy-Item "dist/sing-box-cli.exe" $cliPath

          Push-Location $distDir

          Compress-Archive `
            -Path $cliDir `
            -DestinationPath "${cliDir}.zip" `
            -Force

          Remove-Item -Recurse -Force $cliDir

          Pop-Location

      # ========================================================
      # Cleanup binary after archive
      # ========================================================
      - name: Cleanup (Linux/Android)
        if: runner.os != 'Windows' && matrix.type != 'sfa'
        working-directory: source
        shell: bash
        run: rm -f dist/sing-box

      - name: Cleanup (Windows)
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        run: Remove-Item dist/sing-box.exe, dist/sing-box-cli.exe

      # ========================================================
      # Upload artifacts
      # ========================================================
      - name: Upload artifact (Linux binary / Android core)
        if: >
          (matrix.type == 'binary' || matrix.type == 'android') &&
          runner.os != 'Windows' &&
          (
            inputs.build == 'All' ||
            inputs.build == 'Binary' ||
            inputs.build == 'Android'
          )
        uses: actions/upload-artifact@v7.0.0
        with:
          name: binary-${{ matrix.os }}_${{ matrix.arch }}${{ matrix.variant && format('-{0}', matrix.variant) }}
          path: |
            source/dist/*.tar.gz
            source/dist/*.zip

      - name: Upload artifact (OpenWrt)
        if: >
          matrix.type == 'openwrt' &&
          (inputs.build == 'All' || inputs.build == 'OpenWrt')
        uses: actions/upload-artifact@v7.0.0
        with:
          name: binary-openwrt_${{ matrix.arch }}-musl
          path: source/dist/*.tar.gz

      - name: Upload artifact (Windows GUI)
        if: runner.os == 'Windows' && (inputs.build == 'All' || inputs.build == 'Binary')
        uses: actions/upload-artifact@v7.0.0
        with:
          name: binary-${{ matrix.os }}_${{ matrix.arch }}
          path: "source/dist/*[!-cli].zip"

      - name: Upload artifact (Windows CLI)
        if: runner.os == 'Windows' && (inputs.build == 'All' || inputs.build == 'Binary')
        uses: actions/upload-artifact@v7.0.0
        with:
          name: binary-${{ matrix.os }}_${{ matrix.arch }}-cli
          path: "source/dist/*-cli.zip"

      - name: Upload artifact (SFA)
        if: matrix.type == 'sfa' && (inputs.build == 'All' || inputs.build == 'SFA')
        uses: actions/upload-artifact@v7.0.0
        with:
          name: SFA-${{ needs.calculate_version.outputs.version }}
          path: SFA/app/build/outputs/apk/other/release/*arm64-v8a-unsigned-signed.apk

  # ========================================================
  # Job 2: Release upload
  # ========================================================
  upload:
    name: Upload builds

    if: "!failure() && !cancelled() && inputs.build != ''"

    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: release-${{ needs.calculate_version.outputs.version }}
      cancel-in-progress: false

    needs:
      - calculate_version
      - build

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Set tag
        run: |-
          echo "VERSION=${{ needs.calculate_version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Download builds
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Upload builds (Per-Asset Clobber)
        shell: bash
        run: |
          set -xeuo pipefail

          TAG="v${VERSION}"
          PRERELEASE_FLAG=""

          if [ "${{ inputs.forceBeta }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "${VERSION}" \
              $PRERELEASE_FLAG || {
                gh release view "$TAG" >/dev/null 2>&1 || exit 1
              }
          fi

          gh release upload "$TAG" dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}