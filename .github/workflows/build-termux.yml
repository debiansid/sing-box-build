name: Build Termux App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Termux App

    steps:
      - name: Clone termux-app
        uses: actions/checkout@v4
        with:
          repository: termux/termux-app
          path: termux-app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set version
        id: version
        shell: bash
        run: |
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" termux-app/app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-apt-android-7-github-release"

          echo "version_name=$RELEASE_VERSION_NAME" >> $GITHUB_OUTPUT
          echo "apk_version_tag=$APK_VERSION_TAG" >> $GITHUB_OUTPUT
          echo "Release 版本: $RELEASE_VERSION_NAME"

      - name: Grant gradlew permission
        run: chmod +x termux-app/gradlew

      - name: Build release APK
        working-directory: termux-app
        shell: bash
        run: |
          export TERMUX_APP_VERSION_NAME="${{ steps.version.outputs.version_name }}"
          export TERMUX_APK_VERSION_TAG="${{ steps.version.outputs.apk_version_tag }}"
          export TERMUX_PACKAGE_VARIANT="apt-android-7"
          ./gradlew assembleRelease

      - name: Upload unsigned APKs (all ABIs)
        uses: actions/upload-artifact@v4
        with:
          name: termux-app-unsigned
          path: termux-app/app/build/outputs/apk/release/*.apk

  sign:
    needs: build
    runs-on: ubuntu-latest
    name: Sign ${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        abi: [universal, arm64-v8a, armeabi-v7a, x86_64, x86]

    steps:
      - name: Download unsigned APKs
        uses: actions/download-artifact@v4
        with:
          name: termux-app-unsigned

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: .
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-app-signed-${{ matrix.abi }}
          path: ./*-signed.apk
