name: Maintenance · Clean runs

on:
  # Daily at 21:00 UTC (05:00 UTC+8).
  schedule:
    - cron: 0 21 * * *
  workflow_dispatch:

permissions:
  actions: write

jobs:
  auto_clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete workflow runs older than 30 days
        uses: ophub/delete-releases-workflows@f5873e66feb0a85460d7fbc073de6c89470e94d3 # v1
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: false
          delete_tags: false
          delete_workflows: true
          workflows_keep_day: 30
