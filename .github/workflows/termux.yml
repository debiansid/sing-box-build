name: Build Termux and Termux:API

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择编译项目'
        required: true
        type: choice
        options:
          - both
          - termux-only
          - termux-api-only
        default: 'both'

env:
  TERMUX_APP_REPO: "termux/termux-app"
  TERMUX_API_REPO: "termux/termux-api"
  BUILD_TOOLS_VERSION: "34.0.0"

jobs:
  # ==================== 编译 Termux 本体 ====================
  build-termux:
    if: ${{ github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'termux-only' }}
    runs-on: ubuntu-latest
    name: Build Termux
    
    steps:
      - name: Checkout Termux App
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TERMUX_APP_REPO }}
          path: termux-app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # ====== 关键修复：下载预编译的 bootstrap 包 ======
      - name: Download bootstrap archives
        working-directory: ${{ github.workspace }}/termux-app
        run: |
          ./scripts/download-bootstrap.sh
        shell: bash

      # 备用方案：如果上面的脚本失败，手动下载
      - name: Fallback bootstrap download
        if: failure()
        working-directory: ${{ github.workspace }}/termux-app
        run: |
          BOOTSTRAP_VERSION=$(grep 'TERMUX_PACKAGE_VERSION' app/src/main/cpp/termux-bootstrap.c | head -1 | awk -F '"' '{print $2}')
          if [ -z "$BOOTSTRAP_VERSION" ]; then
            # 如果取不到版本号，用最近的稳定版
            BOOTSTRAP_VERSION="2024.09.27"
          fi
          echo "Bootstrap version: $BOOTSTRAP_VERSION"
          
          mkdir -p app/src/main/cpp
          
          # 下载 arm64 版本
          wget -O app/src/main/cpp/bootstrap-aarch64.zip \
            "https://github.com/termux/termux-packages/releases/download/bootstrap-${BOOTSTRAP_VERSION}/bootstrap-aarch64.zip"
          
          # 下载其他架构（Termux 需要全部四种）
          wget -O app/src/main/cpp/bootstrap-arm.zip \
            "https://github.com/termux/termux-packages/releases/download/bootstrap-${BOOTSTRAP_VERSION}/bootstrap-arm.zip"
          wget -O app/src/main/cpp/bootstrap-i686.zip \
            "https://github.com/termux/termux-packages/releases/download/bootstrap-${BOOTSTRAP_VERSION}/bootstrap-i686.zip"
          wget -O app/src/main/cpp/bootstrap-x86_64.zip \
            "https://github.com/termux/termux-packages/releases/download/bootstrap-${BOOTSTRAP_VERSION}/bootstrap-x86_64.zip"
        shell: bash

      - name: Grant gradlew permission
        run: chmod +x ${{ github.workspace }}/termux-app/gradlew

      - name: Build Unsigned APK
        working-directory: ${{ github.workspace }}/termux-app
        run: ./gradlew assembleRelease

      - name: Sign Termux APK
        uses: r0adkll/sign-android-release@v1
        id: sign_termux
        with:
          releaseDirectory: ${{ github.workspace }}/termux-app/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Upload Signed Termux APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-app-signed
          path: ${{ steps.sign_termux.outputs.signedReleaseFile }}

  # ==================== 编译 Termux:API ====================
  build-termux-api:
    if: ${{ github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'termux-api-only' }}
    runs-on: ubuntu-latest
    name: Build Termux:API
    
    steps:
      - name: Checkout Termux:API
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TERMUX_API_REPO }}
          path: termux-api

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Grant gradlew permission
        run: chmod +x ${{ github.workspace }}/termux-api/gradlew

      - name: Build Unsigned APK
        working-directory: ${{ github.workspace }}/termux-api
        run: ./gradlew assembleRelease

      - name: Sign Termux:API APK
        uses: r0adkll/sign-android-release@v1
        id: sign_api
        with:
          releaseDirectory: ${{ github.workspace }}/termux-api/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Upload Signed Termux:API APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-api-signed
          path: ${{ steps.sign_api.outputs.signedReleaseFile }}
