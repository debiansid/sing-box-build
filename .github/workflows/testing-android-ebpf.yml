name: Testing eBPF · Android

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repository (owner/repo)"
        required: false
        type: string
        default: "debiansid/sing-box"
      source_ref:
        description: "Source branch/tag/commit"
        required: false
        type: string
        default: "testing-ebpf"
      version:
        description: "Version (e.g. 1.15.0-alpha.7 or v1.15.0-alpha.7)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  calculate_version:
    name: Calculate prerelease version
    runs-on: ubuntu-24.04

    outputs:
      full_version: ${{ steps.outputs.outputs.full_version }}
      short_commit: ${{ steps.outputs.outputs.short_commit }}
      upstream_tag: ${{ steps.outputs.outputs.upstream_tag }}

    steps:
      - name: Checkout source repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 1

      - name: Get manually specified version
        id: outputs
        working-directory: source
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          VERSION="${INPUT_VERSION#v}"

          if [ -z "$VERSION" ]; then
            echo "Version must not be empty" >&2
            exit 1
          fi

          UPSTREAM_TAG="v${VERSION}"
          GIT_HASH=$(git rev-parse --short HEAD)
          FULL_VER="${VERSION}-${GIT_HASH}"

          echo "Specified version: ${VERSION}"
          echo "Version tag: ${UPSTREAM_TAG}"
          echo "Source commit: ${GIT_HASH}"
          echo "Build version: ${FULL_VER}"

          echo "upstream_tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_version=${FULL_VER}" >> "$GITHUB_OUTPUT"
          echo "short_commit=${GIT_HASH}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Android arm64
    runs-on: ubuntu-24.04

    needs:
      - calculate_version

    env:
      TAGS: with_quic,with_utls,with_clash_api,with_ebpf,with_tailscale,badlinkname,tfogo_checklinkname0

    steps:
      - name: Checkout source repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache-dependency-path: source/go.mod

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r29

      - name: Build
        working-directory: source
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: arm64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
          BPF_CLANG: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
          FULL_VER: ${{ needs.calculate_version.outputs.full_version }}
        run: |
          set -euo pipefail

          make build VERSION="${FULL_VER}"

      - name: Verify binary
        working-directory: source
        run: |
          set -euo pipefail

          test -f sing-box
          file sing-box

      - name: Archive
        working-directory: source
        env:
          FULL_VER: ${{ needs.calculate_version.outputs.full_version }}
        run: |
          set -euo pipefail

          mkdir -p dist

          tar -czf \
            "dist/sing-box-android-arm64-with-ebpf-${FULL_VER}.tar.gz" \
            sing-box \
            LICENSE

          echo "Archive contents:"
          tar -tzf \
            "dist/sing-box-android-arm64-with-ebpf-${FULL_VER}.tar.gz"

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sing-box-android-arm64-ebpf-${{ needs.calculate_version.outputs.short_commit }}
          path: source/dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release
    runs-on: ubuntu-24.04

    needs:
      - calculate_version
      - build

    permissions:
      contents: write
      actions: write

    concurrency:
      group: release-android-testing-ebpf-${{ needs.calculate_version.outputs.full_version }}
      cancel-in-progress: false

    steps:
      - name: Download archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sing-box-android-arm64-ebpf-${{ needs.calculate_version.outputs.short_commit }}
          path: artifact

      - name: Verify downloaded artifact
        run: |
          set -euo pipefail

          echo "Downloaded files:"
          find artifact -maxdepth 2 -type f -print

          ARCHIVE=$(find artifact -maxdepth 2 -type f -name '*.tar.gz' -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "Archive not found" >&2
            exit 1
          fi

          echo "Archive: ${ARCHIVE}"
          echo "Archive contents:"
          tar -tzf "$ARCHIVE"

      - name: Publish archive
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          FULL_VER: ${{ needs.calculate_version.outputs.full_version }}
          UPSTREAM_TAG: ${{ needs.calculate_version.outputs.upstream_tag }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_COMMIT: ${{ needs.calculate_version.outputs.short_commit }}
          BUILDER_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          TAG="android-testing-ebpf-${FULL_VER}"

          ARCHIVE=$(find artifact -maxdepth 2 -type f -name '*.tar.gz' -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "Archive not found" >&2
            exit 1
          fi

          echo "Specified version: ${UPSTREAM_TAG}"
          echo "Source: ${SOURCE_REPO}@${SOURCE_REF}"
          echo "Source commit: ${SOURCE_COMMIT}"
          echo "Release tag: ${TAG}"
          echo "Release asset: ${ARCHIVE}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$BUILDER_COMMIT" \
              --title "Android testing eBPF ${FULL_VER}" \
              --notes "Built from ${SOURCE_REPO}@${SOURCE_REF} (${SOURCE_COMMIT}), version ${UPSTREAM_TAG}." \
              --prerelease || {
                gh release view "$TAG" >/dev/null 2>&1 || exit 1
              }
          fi

          gh release upload \
            "$TAG" \
            "$ARCHIVE" \
            --clobber

      # Release assets are the durable copy; drop this run's artifacts instead of waiting for retention.
      - name: Delete run artifacts
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" -q '.artifacts[].id' |
            xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"
        env:
          GH_TOKEN: ${{ github.token }}
